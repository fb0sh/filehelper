[tools]
rust = "1.96"
node = "24"
pnpm = "11"

[env]
RUSTC_WRAPPER = ""

[tasks.build]
description = "Build frontend and release binary"
run = """
pnpm install --frozen-lockfile
cd web && npx vite build
cargo build --release
echo ""
echo "Binary: ./target/release/filehelper"
echo "Run: ./target/release/filehelper --addr 0.0.0.0:8080 --password 123"
"""

[tasks.dev]
description = "Start backend and frontend dev servers"
run = """
echo "Starting backend on :8080..."
cargo run -p filehelper -- --addr 127.0.0.1:8080 --password 123 &
BACKEND_PID=$!
sleep 1
echo "Starting frontend on :5173..."
pnpm --dir web dev &
FRONTEND_PID=$!
echo ""
echo "Backend:  http://127.0.0.1:8080"
echo "Frontend: http://localhost:5173"
echo "Press Ctrl+C to stop"
trap "kill $BACKEND_PID $FRONTEND_PID 2>/dev/null; exit" INT TERM
wait
"""

[tasks.test]
description = "Run all tests"
run = """
cargo fmt --check
cargo clippy --workspace --all-targets --all-features -- -D warnings
cargo test --test integration_test
cd web && npx vitest run
"""

[tasks.release]
description = "Full release build with checks"
run = """
cargo fmt --check
cargo clippy --workspace --all-targets --all-features -- -D warnings
cargo test --test integration_test
cd web && npx vitest run
pnpm --dir web build
cargo build --release
echo ""
echo "=== Release built ==="
ls -lh target/release/filehelper
"""