[workspace]
resolver = "2"
members = ["crates/filehelper"]

[workspace.package]
version = "2.0.3"
edition = "2024"
license = "MIT"

# Smaller release binaries: fat LTO + single codegen unit + full strip.
# panic=abort is safe here (no unwinding across FFI boundaries); the
# server's hot path is SQLite/HMAC, so opt-level "z" (size) is fine.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
